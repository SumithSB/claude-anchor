name: build
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift build -c release
      - run: zsh shell/anchor.zsh --selftest
      - run: swift build && .build/debug/Anchor --self-test
