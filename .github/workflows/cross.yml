name: cross

on:
  push:
    branches: [main, "claude/**", cross-platform]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cross
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cross
      - run: cargo clippy -p anchor-core --all-targets -- -D warnings
      - run: cargo test -p anchor-core

      - name: Smoke (bash)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          cargo build -p anchor-core
          export HOME="$(mktemp -d)"
          target/debug/anchor install
          bash -ic 'type claude' 2>&1 | tee out.txt
          grep -q 'function' out.txt

      - name: Smoke (fish)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          sudo apt-get install -y -qq fish >/dev/null
          export HOME="$(mktemp -d)"
          mkdir -p "$HOME/.config/fish"
          target/debug/anchor install
          fish -n "$HOME/.config/fish/conf.d/claude-anchor.fish"
          fish -c 'functions -q claude'
          target/debug/anchor uninstall
          test ! -e "$HOME/.config/fish/conf.d/claude-anchor.fish"

      - name: Smoke (PowerShell)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cargo build -p anchor-core
          # Must not need the Visual C++ runtime (see cross/.cargo/config.toml).
          if (Select-String -Path target\debug\anchor.exe -Pattern 'VCRUNTIME140.dll' -SimpleMatch -Quiet) { Write-Error 'anchor.exe depends on VCRUNTIME140.dll'; exit 1 }
          target\debug\anchor.exe install
          $t = pwsh -Command "(Get-Command claude).CommandType"
          $t
          if ($t -ne 'Function') { exit 1 }

      - name: Smoke (cmd.exe AutoRun)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $key = 'HKCU:\Software\Microsoft\Command Processor'
          New-Item -Force $key | Out-Null
          Set-ItemProperty $key AutoRun 'echo pre >nul'
          target\debug\anchor.exe install
          $v = (Get-ItemProperty $key).AutoRun
          $v
          if ($v -notlike 'echo pre >nul & doskey claude=*anchor.exe" exec -- claude $* 2>nul') { exit 1 }
          if ((cmd /c echo ok) -ne 'ok') { Write-Error 'AutoRun broke cmd'; exit 1 }
          target\debug\anchor.exe install
          if ((Get-ItemProperty $key).AutoRun -ne $v) { Write-Error 'install is not idempotent'; exit 1 }
          target\debug\anchor.exe uninstall
          if ((Get-ItemProperty $key).AutoRun -ne 'echo pre >nul') { Write-Error 'uninstall must keep the existing command'; exit 1 }

  tray:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cross
      - name: Sidecar (Linux)
        if: runner.os == 'Linux'
        run: cross/tray/scripts/prepare-sidecar.sh
      - name: Sidecar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cross\tray\scripts\prepare-sidecar.ps1
      - name: Clippy
        working-directory: cross
        run: cargo clippy -p anchor-tray -- -D warnings
      - name: Build
        working-directory: cross
        run: cargo build -p anchor-tray
