[package]
name = "anchor-core"
version = "0.5.0"
edition = "2021"
description = "Claude Anchor core for Windows and Linux: routing, limits, usage, editor integration"
license = "MIT"

[lib]
name = "anchor_core"
path = "src/lib.rs"

[[bin]]
name = "anchor"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
trash = "5"
regex = "1"

[target.'cfg(target_os = "macos")'.dependencies]
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }

[dev-dependencies]
tempfile = "3"
